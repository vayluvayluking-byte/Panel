<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NØSCOPE X PANEL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0a0a0f; color: #fff; min-height: 100vh; padding: 12px; max-width: 480px; margin: 0 auto; overflow-x: hidden; }

    #splash {
      position: fixed; inset: 0; background: #00040a;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; transition: opacity 0.8s ease;
    }
    .splash-title {
      font-size: clamp(26px, 7vw, 38px); font-weight: 900; letter-spacing: 3px;
      color: #00d4ff; text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
      border-right: 3px solid #ff003c; padding-right: 8px;
      white-space: nowrap; overflow: hidden;
      animation: typing 2.2s steps(18) forwards, blink 0.6s step-end infinite;
    }
    @keyframes typing { from { width: 0 } to { width: 100% } }
    @keyframes blink { 50% { border-color: transparent } }
    .splash-sub { margin-top: 18px; font-size: 12px; color: #00d4ff; letter-spacing: 3px; }

    .header { text-align: center; padding: 8px 0 12px; border-bottom: 2px solid #ff003c; margin-bottom: 14px; }
    .header h1 { font-size: 22px; font-weight: 800; color: #00d4ff; letter-spacing: 1px; text-shadow: 0 0 15px rgba(0,212,255,0.6); }

    .top-bar { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; margin-bottom: 12px; padding: 0 4px; }
    .ping { color: #4ade80; }

    .card {
      background: #12121a; border-radius: 18px; padding: 20px 16px;
      border: 1px solid #1e1e2e; margin-bottom: 16px;
    }

    .mode-badge {
      display: inline-block; background: #1e3a5f; color: #7dd3fc;
      font-size: 11px; font-weight: 600; padding: 5px 14px; border-radius: 20px; margin-bottom: 14px;
    }

    .timer { text-align: center; font-size: 28px; font-weight: 700; color: #facc15; margin-bottom: 4px; }
    .period { text-align: center; font-size: 12px; color: #888; margin-bottom: 16px; }

    .prediction {
      text-align: center; font-size: 58px; font-weight: 900;
      margin: 10px 0 20px; letter-spacing: 3px;
    }
    .prediction.small {
      color: #4ade80;
      text-shadow: 0 0 10px #4ade80, 0 0 20px #4ade80, 0 0 40px #4ade80, 0 0 60px rgba(74,222,128,0.5);
    }
    .prediction.big {
      color: #facc15;
      text-shadow: 0 0 10px #facc15, 0 0 20px #facc15, 0 0 40px #facc15, 0 0 60px rgba(250,204,21,0.5);
    }

    .martingale {
      background: linear-gradient(90deg, #4a1d6e, #6b2d8b);
      color: #fff; text-align: center; padding: 11px; border-radius: 12px;
      font-size: 14px; font-weight: 600; margin-bottom: 18px;
    }

    .opposite-title { text-align: center; font-size: 12px; color: #facc15; margin-bottom: 12px; }
    .numbers { display: flex; justify-content: center; gap: 18px; }
    .num-circle {
      width: 50px; height: 50px; border: 2px solid #facc15; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; color: #facc15;
    }

    .history-card { background: #12121a; border-radius: 18px; padding: 16px; border: 1px solid #1e1e2e; }
    .team-name { font-size: 13px; color: #7dd3fc; margin-bottom: 12px; font-weight: 600; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { color: #888; font-weight: 500; padding: 8px 4px; text-align: left; border-bottom: 1px solid #222; }
    td { padding: 10px 4px; border-bottom: 1px solid #1a1a24; }
    .win { color: #4ade80; font-weight: 600; }
    .loss { color: #f87171; font-weight: 600; }
    .result-num { color: #aaa; font-size: 12px; }

    .login-box { text-align: center; padding: 40px 20px; }
    input {
      width: 85%; padding: 14px; background: #1a1a24; border: 1px solid #333;
      border-radius: 10px; color: #fff; text-align: center; font-size: 16px; margin-bottom: 16px;
    }
    .btn {
      width: 85%; padding: 14px; background: linear-gradient(90deg,#0082ff,#00d4ff);
      border: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="splash">
    <div class="splash-title">NØSCOPE X PANEL</div>
    <div class="splash-sub">HYBRID V16 BOOTING...</div>
  </div>

  <div id="app" class="hidden">
    <div class="header">
      <h1>NØSCOPE X PANEL</h1>
    </div>

    <div id="loginSection" class="card login-box">
      <input type="text" id="keyInput" placeholder="ENTER KEY" autocomplete="off">
      <button class="btn" onclick="login()">LOGIN</button>
    </div>

    <div id="mainPanel" class="hidden">
      <div class="top-bar">
        <span>NØSCOPE X</span>
        <span class="ping" id="ping">PING: 18MS</span>
      </div>

      <div class="card">
        <div style="text-align:center">
          <span class="mode-badge" id="mode">MODE: ANALYZING...</span>
        </div>

        <div class="timer" id="timer">01:00</div>
        <div class="period">PERIOD: <span id="period">---</span></div>

        <div class="prediction small" id="pred">WAIT</div>

        <div class="martingale" id="martingale">MARTINGALE: LEVEL 1 (1X)</div>

        <div class="opposite-title">OPPOSITE CATEGORY NUMBERS:</div>
        <div class="numbers">
          <div class="num-circle" id="num1">?</div>
          <div class="num-circle" id="num2">?</div>
        </div>
      </div>

      <div class="history-card">
        <div class="team-name">TEAM JAVA</div>
        <table>
          <thead>
            <tr>
              <th>PERIOD</th>
              <th>PRED</th>
              <th>RESULT</th>
              <th>STATUS</th>
            </tr>
          </thead>
          <tbody id="history"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  const AUTH_KEY = "VKGAMING1011";
  const API = "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

  let lastPeriod = null;
  let nextPred = null;
  let targetNums = [];
  let level = 1;
  let soundUnlocked = false;

  const sWin  = new Audio("https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3");
  const sLoss = new Audio("https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3");
  const sDing = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3");

  sWin.load();
  sLoss.load();
  sDing.load();

  function unlockSound() {
    if (soundUnlocked) return;
    sWin.play().then(() => { sWin.pause(); sWin.currentTime = 0; }).catch(()=>{});
    sLoss.play().then(() => { sLoss.pause(); sLoss.currentTime = 0; }).catch(()=>{});
    sDing.play().then(() => { sDing.pause(); sDing.currentTime = 0; }).catch(()=>{});
    soundUnlocked = true;
  }

  function playSound(audio) {
    if (!soundUnlocked) return;
    audio.currentTime = 0;
    audio.play().catch(()=>{});
  }

  window.onload = function() {
    setTimeout(function() {
      document.getElementById("splash").style.opacity = "0";
      setTimeout(function() {
        document.getElementById("splash").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
      }, 800);
    }, 2800);
  };

  function login() {
    unlockSound(); 

    var key = document.getElementById("keyInput").value.toUpperCase().trim();
    if (key === AUTH_KEY) {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("mainPanel").classList.remove("hidden");
      startClock();
      sync();
      setInterval(sync, 2000);
    } else {
      alert("Wrong Key!");
    }
  }

  function startClock() {
    setInterval(function() {
      var rem = 60 - new Date().getSeconds();
      var t = rem < 10 ? "00:0" + rem : "00:" + rem;
      document.getElementById("timer").textContent = t;
      document.getElementById("timer").style.color = rem <= 5 ? "#ff003c" : "#facc15";

      if (rem === 5) {
        playSound(sDing);
      }
    }, 1000);
  }

  async function sync() {
    try {
      var res = await fetch(API + "?t=" + Date.now());
      var data = await res.json();
      var list = data.data.list;
      var top = list[0];
      process(top.issueNumber, parseInt(top.number), list);
    } catch (e) {}
  }

  function process(period, num, list) {
    var actual = num >= 5 ? "BIG" : "SMALL";

    if (lastPeriod !== period) {

      if (nextPred !== null && lastPeriod !== null) {
        var isWin = (nextPred === actual) || (targetNums.indexOf(num) !== -1);

        if (isWin) {
          playSound(sWin);          
          level = 1;
        } else {
          playSound(sLoss);         
          level = level + 1;
          if (level > 4) level = 1;
        }

        var multi = "1X";
        if (level === 2) multi = "3X";
        else if (level === 3) multi = "9X";
        else if (level === 4) multi = "27X";

        document.getElementById("martingale").textContent = "MARTINGALE: LEVEL " + level + " (" + multi + ")";

        var statusText = isWin ? "WIN" : "LOSS";
        var statusClass = isWin ? "win" : "loss";

        var row = "<tr>" +
          "<td>" + period.slice(-3) + "</td>" +
          "<td>" + nextPred + "</td>" +
          "<td>" + actual + "<span class='result-num'>(" + num + ")</span></td>" +
          "<td class='" + statusClass + "'>" + statusText + "</td>" +
          "</tr>";

        var historyEl = document.getElementById("history");
        historyEl.innerHTML = row + historyEl.innerHTML;
      }

      lastPeriod = period;

      var last5 = [];
      var lastNums = [];
      for (var i = 0; i < 5 && i < list.length; i++) {
        var n = parseInt(list[i].number);
        last5.push(n >= 5 ? "BIG" : "SMALL");
        lastNums.push(n);
      }

      var sum = 0;
      for (var j = 0; j < lastNums.length; j++) sum += lastNums[j];

      if (last5.length >= 3 && last5[0] === last5[1] && last5[1] === last5[2]) {
        nextPred = last5[0];
        document.getElementById("mode").textContent = "MODE: FREE MODE";
      } else {
        nextPred = (last5[0] === "BIG") ? "SMALL" : "BIG";
        document.getElementById("mode").textContent = "MODE: SMART REVERSE";
      }

      if (nextPred === "BIG") {
        targetNums = sum > 20 ? [0, 2] : [1, 3];
      } else {
        targetNums = sum < 25 ? [7, 9] : [6, 8];
      }

      document.getElementById("period").textContent = (BigInt(period) + 1n).toString();
      document.getElementById("pred").textContent = nextPred;
      document.getElementById("pred").className = "prediction " + nextPred.toLowerCase();

      document.getElementById("num1").textContent = targetNums[0];
      document.getElementById("num2").textContent = targetNums[1];

      document.getElementById("ping").textContent = "PING: " + (12 + Math.floor(Math.random() * 20)) + "MS";
    }
  }
</script>
</body>
</html>
